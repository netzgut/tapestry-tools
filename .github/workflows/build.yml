name: Build

on:
  # Tags are built by the release workflow
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version qualifiers come from the last commit touching each module
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: xvfb-run mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: update-site
          path: net.netzgut.eclipse.tapestry.repository/target/repository/
